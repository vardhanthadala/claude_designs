<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nocturne — 3D Scroll Tunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <section class="spotlight"></section>

  <div class="vignette"></div>

  <div class="chrome">
    <header class="chrome-top">
      <div class="wordmark">
        <span class="wordmark-name">NOCTURNE</span>
        <span class="wordmark-tag">P8 · Glass</span>
      </div>
      <nav class="chrome-nav">
        <span>Index</span>
        <span>Archive</span>
        <span>About</span>
      </nav>
    </header>

    <footer class="chrome-bottom">
      <div class="issue">
        <span class="issue-no">Issue 08</span>
        <h1 class="issue-title">Night Work</h1>
        <p class="issue-sub">Twelve frames shot after dark, flown at depth.</p>
      </div>
      <div class="hint">
        <span class="hint-rule"></span>
        <span>Scroll to fly</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./script.js"></script>
</body>
</html>
